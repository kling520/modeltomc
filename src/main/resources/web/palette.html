<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方块颜色映射 - model2mc</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1118;
      --panel: #151b25;
      --panel-2: #0f141d;
      --border: #2a3240;
      --text: #e8edf7;
      --muted: #97a3b8;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 24px 28px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .muted {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-top: 4px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1118;
      font-weight: 600;
    }

    .btn.primary:hover {
      background: #79b8ff;
    }

    .btn.subtle {
      background: transparent;
      color: var(--muted);
    }

    .btn.subtle:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .btn.danger {
      color: var(--red);
    }

    .btn.danger:hover {
      border-color: var(--red);
    }

    .main {
      padding: 24px 28px 32px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar > select {
      min-width: 180px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .toolbar-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 160px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar-field input,
    .toolbar-field select {
      min-width: 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      max-height: calc(100vh - 260px);
      background: var(--panel-2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--panel);
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
      z-index: 1;
    }

    tbody td {
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr.custom-row {
      background: rgba(88, 166, 255, 0.06);
    }

    .order-cell {
      width: 56px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .row-input {
      width: 100%;
      min-width: 220px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "Consolas", "Microsoft YaHei", monospace;
    }

    .row-input:hover {
      border-color: var(--border);
    }

    .row-input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--panel);
    }

    .block-picker {
      position: relative;
      width: 100%;
    }

    .block-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .block-icon {
      width: 30px;
      height: 30px;
      flex: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      overflow: hidden;
      position: relative;
    }

    .block-icon.has-image {
      background: #000;
    }

    .block-icon-img,
    .block-icon-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .block-icon-img {
      display: none;
      object-fit: cover;
      image-rendering: pixelated;
      z-index: 1;
    }

    .block-icon.has-image .block-icon-img {
      display: block;
    }

    .block-icon-fallback {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
    }

    .block-icon.has-image .block-icon-fallback {
      display: none;
    }

    .block-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .block-zh {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-suggest {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: 280px;
      overflow: auto;
      z-index: 5;
    }

    .block-suggest[hidden] {
      display: none;
    }

    .suggest-item {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .suggest-item:last-child {
      border-bottom: none;
    }

    .suggest-item:hover,
    .suggest-item.active {
      background: rgba(88, 166, 255, 0.14);
    }

    .suggest-main {
      color: var(--text);
      font-family: "Consolas", "Microsoft YaHei", monospace;
      font-size: 12px;
      line-height: 1.45;
      word-break: break-all;
    }

    .suggest-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .color-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      appearance: none;
      width: 36px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    .hex-text {
      width: 84px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: "Consolas", monospace;
    }

    .hex-text:focus {
      outline: none;
      border-color: var(--accent);
      color: var(--text);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      color: var(--accent);
      white-space: nowrap;
    }

    .del-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    .del-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .del-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .empty-tip {
      color: var(--muted);
      text-align: center;
      padding: 40px 16px;
    }

    .footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      border-color: var(--red);
      color: var(--red);
    }

    .toolbar-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal-card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .modal-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .modal-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .modal-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    /* ===== 白天（浅色）模式：夜间维持现状不变，浅色覆盖暗色变量与少量硬编码颜色 ===== */
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f2f5f9;
      --panel: #ffffff;
      --panel-2: #e9eef5;
      --border: #d4dbe6;
      --text: #1c2434;
      --muted: #5c6a80;
      --shadow: 0 14px 32px rgba(28, 40, 60, 0.12);
    }

    html[data-theme="light"] .btn {
      background: var(--panel);
      color: var(--text);
    }

    html[data-theme="light"] .btn.primary {
      background: var(--accent);
      color: #ffffff;
    }

    html[data-theme="light"] .table-wrap {
      background: var(--panel-2);
    }

    html[data-theme="light"] thead th {
      background: var(--panel);
    }

    html[data-theme="light"] tbody tr.custom-row {
      background: rgba(88, 166, 255, 0.08);
    }

    html[data-theme="light"] .row-input:focus,
    html[data-theme="light"] .hex-text:focus {
      background: var(--panel);
    }

    html[data-theme="light"] .block-suggest,
    html[data-theme="light"] .modal-card,
    html[data-theme="light"] .toast {
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    html[data-theme="light"] .block-icon {
      background: var(--panel-2);
    }

    html[data-theme="light"] .del-btn {
      background: transparent;
    }

    html[data-theme="light"] .toolbar > select,
    html[data-theme="light"] .toolbar-field input,
    html[data-theme="light"] .toolbar-field select {
      background: var(--panel);
      color: var(--text);
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>方块颜色映射</h1>
      <p class="muted">自定义方块在 3D 预览与写入映射中使用的颜色。修改后点击「保存」生效。</p>
    </div>
    <div class="header-actions">
      <button class="btn" id="theme-toggle" title="切换白天 / 夜间模式"></button>
      <a href="/" class="btn">返回主页</a>
    </div>
  </header>

  <div class="main">
    <div class="toolbar">
      <select id="profileSelect"></select>
      <button class="btn" id="newProfileBtn">新建文件</button>
      <button class="btn" id="addBtn">添加条目</button>
      <button class="btn subtle" id="restoreDefaultsBtn" hidden>恢复默认设置</button>
      <button class="btn primary" id="saveBtn">保存</button>
      <button class="btn subtle danger" id="deleteProfileBtn">删除文件</button>
      <span class="stats" id="stats" hidden></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 6%">序号</th>
            <th style="width: 32%">颜色</th>
            <th style="width: 42%">方块</th>
            <th style="width: 12%">来源</th>
            <th style="width: 8%"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty-tip" id="emptyTip" style="display: none;">还没有条目。</div>
    </div>

    <div class="footer">
      <div>存储目录: <span id="storePath">-</span></div>
      <div>材质来源: <span id="textureSource">加载中…</span></div>
      <div>说明: 新建映射文件时可以直接复制另一个映射文件作为基础模板，之后两个文件彼此独立。方块 ID 形如 <code>minecraft:stone</code>；颜色可用 <code>#rgb</code> 或 <code>#rrggbb</code>。
        输入框支持按方块 ID、英文名片段或中文名搜索选择；主界面的预览、写入和导出都可选择这里的映射文件。</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="createModal" hidden>
  <div class="modal-card">
    <h2>新建映射文件</h2>
    <p>新文件会先完整复制所选模板，之后两个文件彼此独立。</p>
    <div class="modal-fields">
      <label class="toolbar-field">
        <span>文件 ID</span>
        <input id="createProfileId" placeholder="例如：city_v2">
      </label>
      <label class="toolbar-field">
        <span>复制模板</span>
        <select id="createInheritSelect"></select>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelCreateBtn" type="button">取消</button>
      <button class="btn primary" id="confirmCreateBtn" type="button">新建</button>
    </div>
  </div>
</div>

<script>
  // ===== 主题（白天 / 夜间），与主页共享 localStorage 偏好 =====
  const ICON_SUN = '<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="3.4"/><path d="M9 2v2M9 14v2M2 9h2M14 9h2M3.9 3.9l1.5 1.5M12.6 12.6l1.5 1.5M14.1 3.9l-1.5 1.5M5.4 12.6l-1.5 1.5"/></svg>';
  const ICON_MOON = '<svg width="16" height="16" viewBox="0 0 18 18" fill="currentColor"><path d="M14.7 11.2a6.3 6.3 0 0 1-7.9-7.9A6.3 6.3 0 1 0 14.7 11.2z"/></svg>';
  const themeToggle = document.getElementById("theme-toggle");

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    themeToggle.innerHTML = document.documentElement.dataset.theme === "light" ? ICON_MOON : ICON_SUN;
    themeToggle.title = document.documentElement.dataset.theme === "light" ? "切换到夜间模式" : "切换到白天模式";
  }

  function toggleTheme() {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    try {
      localStorage.setItem("model2mc-theme", next);
    } catch (error) {
      // localStorage 不可用时仅在本次会话生效
    }
    applyTheme(next);
  }

  themeToggle.addEventListener("click", toggleTheme);
  let savedTheme = "dark";
  try {
    savedTheme = localStorage.getItem("model2mc-theme") || "dark";
  } catch (error) {
    // 忽略
  }
  applyTheme(savedTheme);

  const PROFILE_STORAGE_KEY = "model2mc-palette-current-profile-v1";
  const rowsBody = document.getElementById("rows");
  const emptyTip = document.getElementById("emptyTip");
  const stats = document.getElementById("stats");
  const storePath = document.getElementById("storePath");
  const textureSource = document.getElementById("textureSource");
  const toast = document.getElementById("toast");
  const profileSelect = document.getElementById("profileSelect");
  const saveBtn = document.getElementById("saveBtn");
  const restoreDefaultsBtn = document.getElementById("restoreDefaultsBtn");
  const addBtn = document.getElementById("addBtn");
  const newProfileBtn = document.getElementById("newProfileBtn");
  const deleteProfileBtn = document.getElementById("deleteProfileBtn");
  const createModal = document.getElementById("createModal");
  const createProfileId = document.getElementById("createProfileId");
  const createInheritSelect = document.getElementById("createInheritSelect");
  const cancelCreateBtn = document.getElementById("cancelCreateBtn");
  const confirmCreateBtn = document.getElementById("confirmCreateBtn");

  let entries = [];
  let blockCatalog = [];
  let profiles = [];
  let currentProfile = null;
  let toastTimer = null;
  let defaultProfileId = "default";
  const BLOCK_TEXTURE_VERSION = "20260825-leaf-tint-2";

  function showToast(text, isError) {
    toast.textContent = text;
    toast.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.className = "toast";
    }, 2200);
  }

  function normalizeHex(hex) {
    let value = String(hex || "").trim();
    if (value.startsWith("#")) value = value.slice(1);
    if (value.length === 3) {
      value = value.split("").map(c => c + c).join("");
    }
    if (!/^[0-9a-fA-F]{6}$/.test(value)) return null;
    return "#" + value.toLowerCase();
  }

  // 常用方块 -> 中文名
  const BLOCK_ZH = {
    "minecraft:white_concrete": "白色混凝土",
    "minecraft:light_gray_concrete": "浅灰色混凝土",
    "minecraft:gray_concrete": "灰色混凝土",
    "minecraft:black_concrete": "黑色混凝土",
    "minecraft:brown_concrete": "棕色混凝土",

    "minecraft:orange_concrete": "橙色混凝土",
    "minecraft:yellow_concrete": "黄色混凝土",
    "minecraft:lime_concrete": "黄绿色混凝土",

    "minecraft:smooth_stone": "平滑石头",

    "minecraft:andesite": "安山岩",

    "minecraft:sand": "沙子",
    "minecraft:red_sand": "红沙",

  const COLOR_ZH = {
    white: "白色", light_gray: "浅灰色", gray: "灰色", black: "黑色", brown: "棕色",
    red: "红色", orange: "橙色", yellow: "黄色", lime: "黄绿色", green: "绿色",

    magenta: "品红色", pink: "粉红色"
  };

  const WOOD_ZH = {
    oak: "橡木", spruce: "云杉", birch: "白桦", jungle: "丛林",
    acacia: "金合欢", dark_oak: "深色橡木", mangrove: "红树", cherry: "樱花木",
    crimson: "绯红", warped: "诡异", bamboo: "竹"
  };

  const TAIL_ZH = {
    _concrete: "混凝土", _wool: "羊毛", _terracotta: "陶瓦", _planks: "木板",
    _log: "原木", _leaves: "树叶", _fence: "栅栏", _stairs: "楼梯", _slab: "台阶",
    _door: "门", _trapdoor: "活板门", _wall: "墙", _button: "按钮",

    _ore: "矿石", _deepslate: "深板岩", _sapling: "树苗", _sign: "告示牌",
    _powder: "混凝土粉末"

  function resolveZhName(blockId) {
    if (!blockId) return "";
    const cleanId = String(blockId).includes("[") ? String(blockId).slice(0, String(blockId).indexOf("[")) : String(blockId);
    const name = cleanId.includes(":") ? cleanId.split(":")[1] : cleanId;
    if (!name) return "";
    if (BLOCK_ZH[cleanId]) return BLOCK_ZH[cleanId];
    if (BLOCK_ZH["minecraft:" + name]) return BLOCK_ZH["minecraft:" + name];

    const parts = name.split("_");
    if (parts.length >= 2) {
      const first = parts.slice(0, -1).join("_");
      const last = parts[parts.length - 1];
      const tail = "_" + last;
      const color = COLOR_ZH[first];
      const wood = WOOD_ZH[first];
      const colorTail = color && (TAIL_ZH[tail] || last === "concrete") ? color : "";
      const woodTail = wood && TAIL_ZH[tail] ? wood : "";
      const stem = (first === "crimson" || first === "warped")
        ? (last === "stem" ? "菌柄" : last === "hyphae" ? "菌核" : "")
        : "";
      if (last === "powder" && COLOR_ZH[parts[0]]) return COLOR_ZH[parts[0]] + "混凝土粉末";
      if (colorTail && TAIL_ZH[tail]) return colorTail + TAIL_ZH[tail];
      if (colorTail && last === "concrete") return colorTail + "混凝土";
      if (woodTail && TAIL_ZH[tail]) return woodTail + TAIL_ZH[tail];
      if (stem) return WOOD_ZH[first] + stem;
      if (TAIL_ZH[tail]) return name.replace("_", " ") + "(" + TAIL_ZH[tail] + ")";
    }
    return "";
  }

  function buildBlockCatalog(options) {
    const seen = new Set();
    const catalog = [];
    (Array.isArray(options) ? options : []).forEach((rawBlock, index) => {
      const block = String(rawBlock || "").trim();
      if (!block || seen.has(block)) return;
      seen.add(block);
      const localName = block.includes(":") ? block.split(":")[1] : block;
      const zh = resolveZhName(block);
      catalog.push({
        block,
        blockLower: block.toLowerCase(),
        localLower: localName.toLowerCase(),
        zh,
        zhLower: zh.toLowerCase(),
        order: index
      });
    });
    return catalog;
  }

  function exactCatalogBlock(value) {
    const query = String(value || "").trim().toLowerCase();
    if (!query) return "";
    const exact = blockCatalog.find(item =>
      item.blockLower === query ||
      item.localLower === query ||
      (item.zhLower && item.zhLower === query)
    );
    return exact ? exact.block : "";
  }

  function normalizeBlockValue(value) {
    const exact = exactCatalogBlock(value);
    return exact || String(value || "").trim();
  }

  function scoreBlock(item, query) {
    if (item.blockLower === query) return 200;
    if (item.localLower === query) return 190;
    if (item.zhLower && item.zhLower === query) return 180;
    if (item.blockLower.startsWith(query)) return 120;
    if (item.localLower.startsWith(query)) return 110;
    if (item.zhLower && item.zhLower.startsWith(query)) return 100;
    if (item.blockLower.includes(query)) return 80;
    if (item.localLower.includes(query)) return 75;
    if (item.zhLower && item.zhLower.includes(query)) return 70;
    return 0;
  }

  function queryBlockCatalog(rawQuery) {
    const query = String(rawQuery || "").trim().toLowerCase();
    if (!query) {
      return blockCatalog.slice(0, 12);
    }
    return blockCatalog
      .map(item => ({ item, score: scoreBlock(item, query) }))
      .filter(result => result.score > 0)
      .sort((a, b) => b.score - a.score || a.item.order - b.item.order)
      .slice(0, 12)
      .map(result => result.item);
  }

  function setBlockIcon(icon, blockValue, fallbackHex) {
    const img = icon.querySelector(".block-icon-img");
    const fallback = icon.querySelector(".block-icon-fallback");
    const block = normalizeBlockValue(blockValue);
    fallback.style.background = normalizeHex(fallbackHex) || "linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02))";
    if (!block) {
      icon.classList.remove("has-image");
      img.removeAttribute("src");
      return;
    }

    const token = String(Date.now()) + Math.random().toString(16).slice(2);
    img.dataset.token = token;
    img.onload = () => {
      if (img.dataset.token === token) {
        icon.classList.add("has-image");
      }
    };
    img.onerror = () => {
      if (img.dataset.token === token) {
        icon.classList.remove("has-image");
      }
    };
    icon.classList.remove("has-image");
    img.src = "/api/block-texture?block=" + encodeURIComponent(block) + "&v=" + encodeURIComponent(BLOCK_TEXTURE_VERSION);
  }

  function colorSortKey(hex) {
    const normalized = normalizeHex(hex);
    if (!normalized) {
      return [2, Number.MAX_SAFE_INTEGER, Number.MAX_SAFE_INTEGER, Number.MAX_SAFE_INTEGER];
    }
    const value = normalized.slice(1);
    const r = parseInt(value.slice(0, 2), 16) / 255;
    const g = parseInt(value.slice(2, 4), 16) / 255;
    const b = parseInt(value.slice(4, 6), 16) / 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const delta = max - min;
    const lightness = (max + min) / 2;
    const saturation = delta === 0 ? 0 : delta / (1 - Math.abs(2 * lightness - 1));
    let hue = 0;
    if (delta !== 0) {
      if (max === r) {
        hue = 60 * (((g - b) / delta) % 6);
      } else if (max === g) {
        hue = 60 * (((b - r) / delta) + 2);
      } else {
        hue = 60 * (((r - g) / delta) + 4);
      }
    }
    if (hue < 0) hue += 360;
    const grayscaleBucket = saturation < 0.08 ? 1 : 0;
    return [
      grayscaleBucket,
      Math.round(hue * 100),
      Math.round(lightness * 1000),
      Math.round(saturation * 1000)
    ];
  }

  function compareColorHex(a, b) {
    const aKey = colorSortKey(a);
    const bKey = colorSortKey(b);
    for (let i = 0; i < aKey.length; i++) {
      if (aKey[i] !== bKey[i]) {
        return aKey[i] - bKey[i];
      }
    }
    return String(a || "").localeCompare(String(b || ""));
  }

  function sortEntriesByColor(list) {
    return [...(Array.isArray(list) ? list : [])].sort((a, b) => {
      const colorDiff = compareColorHex(a?.color, b?.color);
      if (colorDiff !== 0) return colorDiff;
      return String(a?.block || "").localeCompare(String(b?.block || ""));
    });
  }

  function renumberRows() {
    Array.from(rowsBody.querySelectorAll("tr")).forEach((row, index) => {
      const orderCell = row.querySelector(".order-cell");
      if (orderCell) {
        orderCell.textContent = String(index + 1);
      }
    });
  }

  function sortRenderedRows() {
    const rows = Array.from(rowsBody.querySelectorAll("tr"));
    rows.sort((a, b) => {
      const colorDiff = compareColorHex(
        a.querySelector(".hex-text")?.value,
        b.querySelector(".hex-text")?.value
      );
      if (colorDiff !== 0) return colorDiff;
      return (a.querySelector(".row-input")?.value || "").localeCompare(b.querySelector(".row-input")?.value || "");
    });
    rows.forEach(row => rowsBody.appendChild(row));
    renumberRows();
  }

  function makeRow(entry) {
    const tr = document.createElement("tr");
    if (entry.source && entry.source !== "default") tr.className = "custom-row";

    const orderTd = document.createElement("td");
    orderTd.className = "order-cell";

    const icon = document.createElement("div");
    icon.className = "block-icon";
    const iconImg = document.createElement("img");
    iconImg.className = "block-icon-img";
    iconImg.alt = "";
    const iconFallback = document.createElement("div");
    iconFallback.className = "block-icon-fallback";
    icon.appendChild(iconImg);
    icon.appendChild(iconFallback);

    const zhLabel = document.createElement("span");
    zhLabel.className = "block-zh";

    const blockInput = document.createElement("input");
    blockInput.className = "row-input";
    blockInput.value = entry.block;
    blockInput.placeholder = "输入方块 ID / 中文名";
    blockInput.spellcheck = false;
    blockInput.autocomplete = "off";

    const suggest = document.createElement("div");
    suggest.className = "block-suggest";
    suggest.hidden = true;
    let suggestionItems = [];
    let activeIndex = -1;

    const colorInput = document.createElement("input");
    colorInput.type = "color";
    colorInput.value = entry.color;

    const hexInput = document.createElement("input");
    hexInput.className = "hex-text";
    hexInput.value = entry.color;

    function updateBlockMeta() {
      const value = blockInput.value.trim();
      const resolved = normalizeBlockValue(value);
      zhLabel.textContent = resolveZhName(resolved || value);
      blockInput.title = resolved || value;
      setBlockIcon(icon, resolved || value, colorInput.value);
    }

    function hideSuggest() {
      suggest.hidden = true;
      suggestionItems = [];
      activeIndex = -1;
    }

    function refreshActiveSuggestion() {
      Array.from(suggest.children).forEach((child, index) => {
        child.classList.toggle("active", index === activeIndex);
      });
    }

    function applySuggestion(block) {
      blockInput.value = block;
      hideSuggest();
      updateBlockMeta();
    }

    function renderSuggest() {
      const results = queryBlockCatalog(blockInput.value);
      suggest.innerHTML = "";
      suggestionItems = results;
      activeIndex = results.length ? 0 : -1;
      if (!results.length) {
        hideSuggest();
        return;
      }
      results.forEach((item, index) => {
        const option = document.createElement("div");
        option.className = "suggest-item" + (index === activeIndex ? " active" : "");
        const main = document.createElement("div");
        main.className = "suggest-main";
        main.textContent = item.block;
        option.appendChild(main);
        const sub = document.createElement("div");
        sub.className = "suggest-sub";
        sub.textContent = item.zh || "未提供中文名";
        option.appendChild(sub);
        option.addEventListener("mousedown", event => {
          event.preventDefault();
          applySuggestion(item.block);
        });
        suggest.appendChild(option);
      });
      suggest.hidden = false;
    }

    function normalizeTypedBlock() {
      const normalized = normalizeBlockValue(blockInput.value);
      if (normalized) {
        blockInput.value = normalized;
      }
      updateBlockMeta();
    }

    blockInput.addEventListener("focus", renderSuggest);
    blockInput.addEventListener("input", () => {
      updateBlockMeta();
      renderSuggest();
    });
    blockInput.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        hideSuggest();
        return;
      }
      if (!suggest.hidden && suggestionItems.length) {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          activeIndex = (activeIndex + 1) % suggestionItems.length;
          refreshActiveSuggestion();
          return;
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          activeIndex = (activeIndex - 1 + suggestionItems.length) % suggestionItems.length;
          refreshActiveSuggestion();
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          if (activeIndex >= 0 && suggestionItems[activeIndex]) {
            applySuggestion(suggestionItems[activeIndex].block);
          } else {
            normalizeTypedBlock();
          }
          return;
        }
      } else if (event.key === "Enter") {
        normalizeTypedBlock();
      }
    });
    blockInput.addEventListener("blur", () => {
      setTimeout(() => {
        normalizeTypedBlock();
        hideSuggest();
      }, 120);
    });

    colorInput.addEventListener("input", () => {
      hexInput.value = colorInput.value;
      setBlockIcon(icon, blockInput.value, colorInput.value);
    });
    colorInput.addEventListener("change", sortRenderedRows);
    hexInput.addEventListener("change", () => {
      const normalized = normalizeHex(hexInput.value);
      if (normalized) {
        colorInput.value = normalized;
        setBlockIcon(icon, blockInput.value, normalized);
      } else {
        hexInput.value = colorInput.value;
      }
      sortRenderedRows();
    });

    const picker = document.createElement("div");
    picker.className = "block-picker";
    picker.appendChild(blockInput);
    picker.appendChild(suggest);
    tr.openBlockSuggest = () => {
      blockInput.focus();
      renderSuggest();
    };

    const blockInfo = document.createElement("div");
    blockInfo.className = "block-info";
    blockInfo.appendChild(zhLabel);
    blockInfo.appendChild(picker);

    const blockCell = document.createElement("div");
    blockCell.className = "block-cell";
    blockCell.appendChild(icon);
    blockCell.appendChild(blockInfo);

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = entry.sourceLabel || (entry.source === "current" ? "当前" : "默认");

    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.title = "删除该条目";
    delBtn.textContent = "×";
    delBtn.addEventListener("click", () => {
      tr.remove();
      updateStats();
      renumberRows();
    });

    const blockTd = document.createElement("td");
    blockTd.appendChild(blockCell);
    const colorTd = document.createElement("td");
    const colorCell = document.createElement("div");
    colorCell.className = "color-cell";
    colorCell.appendChild(colorInput);
    colorCell.appendChild(hexInput);
    colorTd.appendChild(colorCell);
    const badgeTd = document.createElement("td");
    badgeTd.appendChild(badge);
    const delTd = document.createElement("td");
    delTd.appendChild(delBtn);

    tr.appendChild(orderTd);
    tr.appendChild(colorTd);
    tr.appendChild(blockTd);
    tr.appendChild(badgeTd);
    tr.appendChild(delTd);

    updateBlockMeta();
    return tr;
  }

  function render() {
    rowsBody.innerHTML = "";
    entries = sortEntriesByColor(entries);
    for (const entry of entries) {
      rowsBody.appendChild(makeRow(entry));
    }
    renumberRows();
    updateStats();
  }

  function updateStats() {
    const rows = rowsBody.querySelectorAll("tr");
    emptyTip.style.display = rows.length ? "none" : "block";
    stats.textContent = "";
  }

  function collectRows() {
    const rows = [];
    for (const tr of rowsBody.querySelectorAll("tr")) {
      const block = normalizeBlockValue(tr.querySelector(".row-input").value);
      const hex = tr.querySelector(".hex-text").value.trim();
      if (!block && !hex) continue;
      rows.push({ block, color: hex });
    }
    return rows;
  }

  function selectedProfileId() {
    return profileSelect.value || currentProfile?.id || defaultProfileId;
  }

  function persistProfileSelection(profileId) {
    try {
      localStorage.setItem(PROFILE_STORAGE_KEY, profileId);
    } catch (error) {
      // ignore localStorage errors
    }
  }

  function restoreProfileSelection() {
    try {
      return localStorage.getItem(PROFILE_STORAGE_KEY) || defaultProfileId;
    } catch (error) {
      return defaultProfileId;
    }
  }

  function renderCreateTemplateOptions(selectedId) {
    createInheritSelect.innerHTML = "";
    const emptyOption = document.createElement("option");
    emptyOption.value = "";
    emptyOption.textContent = "无";
    createInheritSelect.appendChild(emptyOption);
    profiles.forEach(profile => {
      const option = document.createElement("option");
      option.value = profile.id;
      option.textContent = profileDisplayName(profile);
      createInheritSelect.appendChild(option);
    });
    const fallback = selectedId || currentProfile?.id || defaultProfileId;
    const exists = profiles.some(profile => profile.id === fallback);
    createInheritSelect.value = exists ? fallback : "";
  }

  function openCreateModal(preferredInherit) {
    renderCreateTemplateOptions(preferredInherit);
    createProfileId.value = "";
    createModal.hidden = false;
    setTimeout(() => createProfileId.focus(), 0);
  }

  function closeCreateModal() {
    createModal.hidden = true;
  }

  function renderToolbarState() {
    const builtin = !!currentProfile?.builtin;
    deleteProfileBtn.hidden = builtin;
    saveBtn.textContent = "保存";
    addBtn.textContent = "添加条目";
    restoreDefaultsBtn.hidden = !builtin;
  }

  function profileDisplayName(profile) {
    if (!profile) return "";
    if (profile.builtin && profile.id === defaultProfileId) {
      return "默认模板";
    }
    return profile.id;
  }

  function renderProfileControls() {
    profileSelect.innerHTML = "";
    profiles.forEach(profile => {
      const option = document.createElement("option");
      option.value = profile.id;
      option.textContent = profileDisplayName(profile);
      profileSelect.appendChild(option);
    });
    if (currentProfile) {
      profileSelect.value = currentProfile.id;
    }
    renderToolbarState();
  }

  async function load(profileId) {
    try {
      const response = await fetch("/api/palette?profile=" + encodeURIComponent(profileId || selectedProfileId()));
      if (!response.ok) throw new Error("加载失败: " + response.status);
      const data = await response.json();
      profiles = Array.isArray(data.profiles) ? data.profiles : [];
      currentProfile = data.currentProfile || null;
      defaultProfileId = data.defaultProfileId || defaultProfileId;
      entries = sortEntriesByColor(data.entries);
      blockCatalog = buildBlockCatalog(data.blockOptions);
      renderProfileControls();
      storePath.textContent = data.storePath || "-";
      textureSource.textContent = data.textureAvailable
        ? (data.textureSource || "已启用原版方块材质")
        : "未找到 Minecraft 原版 JAR，图标将回退为纯色预览";
      if (currentProfile?.id) {
        persistProfileSelection(currentProfile.id);
      }
      render();
    } catch (error) {
      showToast(error.message, true);
      stats.textContent = "加载失败";
      textureSource.textContent = "加载失败";
    }
  }

  addBtn.addEventListener("click", () => {
    const randomColor = "#" + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0");
    const row = makeRow({ block: "", color: randomColor, source: "current", sourceLabel: "当前" });
    rowsBody.appendChild(row);
    sortRenderedRows();
    updateStats();
    row.openBlockSuggest?.();
  });

  restoreDefaultsBtn.addEventListener("click", async () => {
    if (!currentProfile?.builtin) return;
    if (!confirm("确定将默认模板恢复为内置默认设置吗？当前修改会被覆盖。")) return;
    const params = new URLSearchParams();
    params.set("action", "restore-defaults");
    params.set("profile", selectedProfileId());
    try {
      const response = await fetch("/api/palette", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      });
      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || "恢复失败: " + response.status);
      }
      await load();
      showToast("已恢复默认设置");
    } catch (error) {
      showToast(error.message, true);
    }
  });

  profileSelect.addEventListener("change", () => {
    load(profileSelect.value);
  });

  newProfileBtn.addEventListener("click", () => {
    openCreateModal(selectedProfileId());
  });

  cancelCreateBtn.addEventListener("click", closeCreateModal);
  createModal.addEventListener("click", event => {
    if (event.target === createModal) {
      closeCreateModal();
    }
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !createModal.hidden) {
      closeCreateModal();
    }
  });

  confirmCreateBtn.addEventListener("click", async () => {
    const id = createProfileId.value.trim();
    if (!id) {
      showToast("请先填写文件 ID", true);
      createProfileId.focus();
      return;
    }
    const params = new URLSearchParams();
    params.set("action", "create");
    params.set("id", id);
    params.set("inherits", createInheritSelect.value || selectedProfileId());
    try {
      const response = await fetch("/api/palette", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      });
      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || "新建失败: " + response.status);
      }
      closeCreateModal();
      await load(id);
      showToast("已按模板复制出新映射文件");
    } catch (error) {
      showToast(error.message, true);
    }
  });

  deleteProfileBtn.addEventListener("click", async () => {
    if (!currentProfile?.id) return;
    if (!confirm(`确定删除映射文件 ${currentProfile.id} 吗？`)) return;
    const params = new URLSearchParams();
    params.set("action", "delete");
    params.set("profile", currentProfile.id);
    try {
      const response = await fetch("/api/palette", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      });
      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || "删除失败: " + response.status);
      }
      await load(currentProfile.inherits || defaultProfileId);
      showToast("已删除映射文件");
    } catch (error) {
      showToast(error.message, true);
    }
  });

  saveBtn.addEventListener("click", async () => {
    try {
      const rows = collectRows();
      const params = new URLSearchParams();
      params.set("action", "save");
      params.set("profile", selectedProfileId());
      params.set("inherits", currentProfile?.inherits || defaultProfileId);
      params.set("count", String(rows.length));
      rows.forEach((row, index) => {
        params.set("block" + index, row.block);
        params.set("color" + index, row.color);
      });
      const response = await fetch("/api/palette", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params.toString()
      });
      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || "保存失败: " + response.status);
      }
      await load();
      showToast("已保存，预览与写入映射已生效");
    } catch (error) {
      showToast(error.message, true);
    }
  });

  load(restoreProfileSelection());
</script>
</body>
</html>
